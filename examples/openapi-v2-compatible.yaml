openapi: 3.0.3
info:
  title: Inventory API
  version: 1.1.0
paths:
  /items:
    get:
      operationId: listItems
      responses:
        '200':
          description: Inventory item
          content:
            application/json:
              schema:
                type: object
                required: [id, name]
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  description:
                    type: string
  /items/{id}:
    get:
      operationId: getItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Found
