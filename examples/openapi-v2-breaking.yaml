openapi: 3.0.3
info:
  title: Inventory API
  version: 2.0.0
paths:
  /items:
    get:
      operationId: listItems
      parameters:
        - name: warehouse
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Inventory item
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
