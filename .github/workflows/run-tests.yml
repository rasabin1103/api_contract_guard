name: Run Contract Guard

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'compare, validate_contract o validate_schema'
        required: true
        type: choice
        default: compare
        options: [compare, validate_contract, validate_schema]
      contract_a:
        description: 'Contrato OpenAPI (referencia en compare; contrato a usar en validate_contract)'
        type: string
        default: ''
      contract_b:
        description: 'Contrato OpenAPI candidato (solo compare)'
        type: string
        default: ''
      schema:
        description: 'JSON Schema (solo validate_schema)'
        type: string
        default: ''
      response:
        description: 'Respuesta JSON capturada (validate_contract y validate_schema)'
        type: string
        default: ''
      path:
        description: 'Ruta de la operación, por ejemplo /orders/42 (solo validate_contract)'
        type: string
        default: ''
      method:
        description: 'Método HTTP (solo validate_contract)'
        type: choice
        default: ''
        options: ['', GET, POST, PUT, PATCH, DELETE]
      status_code:
        description: 'Código de estado de la respuesta, por ejemplo 200 (solo validate_contract)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  contract-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.lock
          python -m pip install --no-deps -e backend
      - name: Install oasdiff
        run: sh tools/install-oasdiff.sh
      - name: Run Contract Guard
        env:
          ACG_OASDIFF_PATH: ${{ github.workspace }}/tools/bin/oasdiff
          CG_MODE: ${{ inputs.mode }}
          CG_CONTRACT_A: ${{ inputs.contract_a }}
          CG_CONTRACT_B: ${{ inputs.contract_b }}
          CG_SCHEMA: ${{ inputs.schema }}
          CG_RESPONSE: ${{ inputs.response }}
          CG_PATH: ${{ inputs.path }}
          CG_METHOD: ${{ inputs.method }}
          CG_STATUS_CODE: ${{ inputs.status_code }}
        run: python tools/ase_run.py
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: report.html
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload result JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: request-result
          path: request_result.json
          if-no-files-found: ignore
          retention-days: 7
