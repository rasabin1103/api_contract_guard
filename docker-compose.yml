services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ACG_DATABASE_URL: sqlite:////app/data/guard.db
      ACG_MAX_UPLOAD_BYTES: ${ACG_MAX_UPLOAD_BYTES:-2097152}
      ACG_COMPARISON_TIMEOUT: ${ACG_COMPARISON_TIMEOUT:-30}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - guard-data:/app/data
    mem_limit: 768m
    cpus: 2
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
volumes:
  guard-data:
