[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ase-api-contract-guard"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.135.1", "uvicorn==0.42.0", "pydantic-settings==2.14.2",
  "sqlalchemy==2.0.48", "alembic==1.18.4", "python-multipart==0.0.31",
  "PyYAML==6.0.3", "openapi-spec-validator==0.8.1", "psycopg[binary]==3.3.3",
  "openapi-schema-validator==0.7.3", "jsonschema==4.24.1", "referencing==0.37.0"
]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "httpx==0.28.1", "ruff==0.15.6", "mypy==1.19.1", "types-PyYAML==6.0.12.20250915", "pip-audit==2.10.0"]

[project.scripts]
contract-guard = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
